services:
  postgres:
    image: postgres:16
    container_name: password_vault_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-vault_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vault_secret_2024}
      POSTGRES_DB: ${DB_NAME:-password_vault}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-vault_admin} -d ${DB_NAME:-password_vault}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
